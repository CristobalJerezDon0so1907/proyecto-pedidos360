spring.application.name=microservices-fraud
server.port=8085

# ===== Kafka (Evaluacion 3 - Guia 3.2.2: Pipeline de eventos) =====
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Productor (simulador de pedidos): key = cliente (String), value = Pedido (JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Streams
spring.kafka.streams.application-id=pedidos360-fraud-pipeline
# Publicar resultados rapido (por defecto Streams espera ~30 s antes de emitir la agregacion)
spring.kafka.streams.properties.commit.interval.ms=1000
spring.kafka.streams.properties.statestore.cache.max.bytes=0

# Topics del pipeline
app.topics.entrada=pedidos-transacciones
app.topics.alertas=pedidos-alertas
app.topics.totales=pedidos-total-cliente