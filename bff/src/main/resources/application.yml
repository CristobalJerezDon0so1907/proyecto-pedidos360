spring:
  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: lb://microservices-inventory
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: lb://microservices-order
          predicates:
            - Path=/api/orders/**

        - id: shipment-service
          uri: lb://microservices-shipment
          predicates:
            - Path=/api/shipments/**

        - id: bff-service
          uri: lb://microservices-bff
          predicates:
            - Path=/**