server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Order-service:  /order/api/admin/queues  ->  order-service:8081/api/admin/queues
    location /order/ {
        proxy_pass http://order-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BFF:  /bff/api/bff/checkout  ->  bff-service:8080/api/bff/checkout
    location /bff/ {
        proxy_pass http://bff-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular: cualquier otra ruta carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}