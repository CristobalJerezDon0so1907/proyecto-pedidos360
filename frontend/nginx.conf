server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: Nginx vuelve a buscar la IP de cada servicio cada 10 s.
    # (Evita el "502 Bad Gateway" cuando se reconstruye un microservicio y cambia de IP)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Order-service:  /order/api/...  ->  order-service:8081/api/...
    location /order/ {
        set $order_upstream order-service:8081;
        rewrite ^/order/(.*)$ /$1 break;
        proxy_pass http://$order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BFF:  /bff/api/...  ->  bff-service:8080/api/...
    location /bff/ {
        set $bff_upstream bff-service:8080;
        rewrite ^/bff/(.*)$ /$1 break;
        proxy_pass http://$bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fraud-service (pipeline Kafka Streams):  /fraud/api/...  ->  fraud-service:8085/api/...
    location /fraud/ {
        set $fraud_upstream fraud-service:8085;
        rewrite ^/fraud/(.*)$ /$1 break;
        proxy_pass http://$fraud_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular: cualquier otra ruta carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}