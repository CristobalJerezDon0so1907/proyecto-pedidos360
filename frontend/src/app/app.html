<div class="container">
  <h2>Consola de Envíos RabbitMQ</h2>

  <!-- Panel de Tarjetas de Métricas -->
  <div class="stats-panel">
    <div class="stat-card">
      <div class="stat-number">{{ stats.total }}</div>
      <div class="stat-label">Total Órdenes</div>
    </div>
    <div class="stat-card success">
      <div class="stat-number">{{ stats.success }}</div>
      <div class="stat-label">Procesadas</div>
    </div>
    <div class="stat-card error">
      <div class="stat-number">{{ stats.failed }}</div>
      <div class="stat-label">En DLQ</div>
    </div>
  </div>

  <div class="form-group">
    <label>Tipo / Severidad:</label>
    <select [(ngModel)]="selectedType">
      <option value="INFO">INFO (Éxito - Canal General)</option>
      <option value="FAIL">FAIL (Error Simulado -> DLQ)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Mensaje del Pedido:</label>
    <input type="text" [(ngModel)]="messageText" />
  </div>

  <button (click)="executeSend()" class="btn-primary">Ejecutar</button>

  <div *ngIf="statusMessage" class="alert-box">
    {{ statusMessage }}
  </div>
</div>
